    <!-- Boot screen: painted on the first frame, removed by main.js when the game is ready. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 22px;
        background: linear-gradient(#a9c4dc, #e7d6cb 70%, #f4e4d6); color: #172031; font: 700 13px/1 'Nunito', 'Avenir Next', system-ui, sans-serif;
        letter-spacing: 0.24em; text-transform: uppercase; transition: opacity 0.5s; }
      #boot b { font: 600 clamp(34px, 8vw, 72px)/1 'Fredoka', 'Nunito', system-ui, sans-serif; letter-spacing: 0.1em; margin-right: -0.1em; }
      #boot i { position: relative; width: 120px; height: 2px; overflow: hidden; border-radius: 1px; background: rgba(23, 32, 49, 0.12); }
      #boot i::after { content: ''; position: absolute; inset: 0; width: 40%; background: #172031; animation: boot 1.2s cubic-bezier(0.6, 0, 0.4, 1) infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot i::after { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-live="polite"><b>Snowline</b><i></i><span>Loading the mountain</span></div>

    <!-- p5.js world canvas (full viewport, behind everything) -->
    <div id="stage" aria-hidden="true"></div>

    <!-- DOM UI: screens, HUD and overlays are built by src/ui/UI.js -->
    <main id="ui" aria-live="off"></main>

    <noscript>Snowline needs JavaScript to run.</noscript>

    <!-- Libraries (vendored, so the game also works offline). defer: does not block the first paint,
         still runs before the module below (document order). -->
    <script defer src="lib/p5.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
